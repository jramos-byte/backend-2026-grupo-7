name: Deploy to Kubero

on:
  workflow_run:
    workflows: ["Build server image"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-kubero:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy API Veterinaria en Kubero
        if: ${{ github.event.workflow_run.name == 'Build server image' }}
        run: |
          curl -s -o /dev/null -w "Deploy status: %{http_code}\n" -X GET \
            "https://kubero.inf.uct.cl/api/apps/grupo7backends3/production/api/restart" \
            -H "Authorization: Bearer ${{ secrets.KUBERO_TOKEN }}"